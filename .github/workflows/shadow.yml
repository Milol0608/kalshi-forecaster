# Hourly shadow run on GitHub's free runners, against a free Neon Postgres.
# Shadow mode only: no Kalshi keys are needed or provided here.
#
# Triggered every hour by cron-job.org calling GitHub's workflow-dispatch API with a fine-grained
# token limited to this repo's Actions (see docs/HOSTING.md). GitHub's own `schedule:` trigger
# never fired for this repo (2026-11-23/24), so it's removed: if it woke up later, the bot would
# run twice an hour. The report flags gaps in the hourly runs.
name: shadow

on:
  workflow_dispatch: {}   # called hourly by cron-job.org; also the "Run workflow" button

concurrency:
  group: shadow
  cancel-in-progress: false   # never run two pipelines against the same database at once

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: shadow
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --no-dev

      - name: Check database secret
        # Prints only yes/no facts about the secret's shape and its length, never any part of it.
        run: |
          v="$DATABASE_URL"
          if [ -z "$v" ]; then echo "::error::Add the DATABASE_URL repository secret (see docs/HOSTING.md)"; exit 1; fi
          yn() { if eval "$1"; then echo yes; else echo no; fi; }
          echo "length: ${#v}"
          echo "starts with postgresql:// or postgres://: $(yn '[[ "$v" == postgresql://* || "$v" == postgres://* ]]')"
          echo "starts with a quote: $(yn '[[ "$v" == \"* || "$v" == '"\\'"'* ]]')"
          echo "starts with 'psql ': $(yn '[[ "$v" == psql\ * ]]')"
          echo "contains whitespace or newline: $(yn '[[ "$v" =~ [[:space:]] ]]')"
          echo "contains '@' and 'neon.tech': $(yn '[[ "$v" == *@*neon.tech* ]]')"

      - name: Migrate database
        run: uv run alembic upgrade head

      - name: Check schema matches the models
        # Adds indexes/constraints a restored copy is missing (a no-op once it matches) and
        # reports anything it can't fix. Doesn't block the run.
        continue-on-error: true
        run: uv run python -m app.jobs.schema_check --repair

      - name: Run all jobs once (settle, scan, weather, forecast, shadow, retention)
        run: uv run python -m app.jobs.schedule --once

      - name: Report
        run: uv run python -m app.report
