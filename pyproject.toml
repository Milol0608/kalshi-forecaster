[project]
name = "kalshi-forecaster"
version = "0.1.0"
description = "Calibrated Kalshi forecaster. Shadow mode first; live trading is gated."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "cryptography>=42",
    "numpy>=2.5.5",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests against recorded fixtures or a real database",
]
